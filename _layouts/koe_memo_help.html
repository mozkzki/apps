<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ja' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ page.title }}</title>
<style>
/* 声で即メモのヘルプ専用(アプリの設定 →「ヘルプ」の WebView で開く)。他のアプリのページは cayman のまま */
:root {
  --bg: #f2f2f7; --card: #ffffff; --fg: #1c1c1e; --muted: #6c6c70; --line: #e3e3e8;
  --accent: #f5c400; --accent-ink: #2a2200; --link: #007aff;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000000; --card: #1c1c1e; --fg: #f2f2f7; --muted: #98989f; --line: #38383a; --link: #0a84ff; }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 64px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.7; overflow-wrap: anywhere; }
a { color: var(--link); }
img { max-width: 100%; height: auto; }

.hero { background: var(--accent); color: var(--accent-ink); padding: 24px 16px 20px; display: flex; gap: 14px; align-items: center; }
.hero img { width: 56px; height: 56px; border-radius: 13px; flex: none; }
.hero h1 { font-size: 22px; line-height: 1.25; margin: 0; }
.hero p { font-size: 13px; margin: 2px 0 0; opacity: .75; }

.toc { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; scrollbar-width: none; }
.toc::-webkit-scrollbar { display: none; }
.toc a { flex: none; font-size: 14px; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; }

main { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }
h2 { font-size: 22px; line-height: 1.3; margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 3px solid var(--accent); }
h3 { font-size: 17px; margin: 22px 0 8px; }
.body h3 { font-size: 16px; margin: 20px 0 6px; }
p { margin: 0 0 12px; }

/* 折りたたみ: 押せると分かるカード */
details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 0 0 10px; }
summary { cursor: pointer; list-style: none; padding: 14px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+"; width: 24px; height: 24px; border-radius: 7px; background: var(--bg); color: var(--muted); display: grid; place-items: center; font-weight: 700; flex: none; }
details[open] > summary::before { content: "−"; }
details[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 14px; }
details > :not(summary) { margin-left: 14px; margin-right: 14px; }
details > :last-child { margin-bottom: 16px; }

/* 手順: 番号の丸。画面写真がある手順は、文の横に写真を並べる */
ol { list-style: none; padding: 0; counter-reset: s; display: grid; gap: 16px; }
ol > li { counter-increment: s; position: relative; padding-left: 36px; }
ol > li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; display: grid; place-items: center; }
ol > li > p { margin: 0; }
ol > li:has(img) { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 12px; align-items: start; }
ol > li img { display: block; width: 112px; margin: 0; border-radius: 12px; border: 1px solid var(--line); }
ul { padding-left: 1.2em; margin: 0 0 12px; }
ul > li + li { margin-top: 6px; }

/* 手順の外の画面写真は、大きくなりすぎないように */
p > img { display: block; width: 240px; border-radius: 14px; border: 1px solid var(--line); margin: 4px auto; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; font-size: 14px; margin: 0 0 14px; width: 100%; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 13px; }
td code { font-family: var(--mono); font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<header class="hero">
  <img src="{{ '/koe_memo/images/icon.png' | relative_url }}" alt="">
  <div>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
  </div>
</header>
{% if page.toc %}
<nav class="toc">
  {% for item in page.toc %}<a href="#{{ item.id }}">{{ item.label }}</a>{% endfor %}
</nav>
{% endif %}
<main>
{{ content }}
</main>
<script>
// 表を横にスクロールできる枠で包む(狭い画面で本文がはみ出さないように)
document.querySelectorAll('main table').forEach(function (t) {
  var w = document.createElement('div'); w.className = 'tbl';
  t.parentNode.insertBefore(w, t); w.appendChild(t);
});
</script>
</body>
</html>
